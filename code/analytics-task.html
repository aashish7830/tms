<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | TMS Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --sidebar-bg: #fff;
            --main-bg: #f8f9fa;
            --primary-blue: #007bff;
            --card-border: #eaedf2;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--main-bg); overflow-x: hidden; color: #333; }

        .sidebar { width: 240px; height: 90vh; background: var(--sidebar-bg); border-right: 1px solid var(--card-border); position: fixed; padding: 20px; z-index: 1050; }
        .nav-link { color: #6c757d; font-weight: 500; padding: 12px 15px; border-radius: 8px; margin-bottom: 5px; display: flex; align-items: center; gap: 12px; text-decoration: none; }
        .nav-link.active { background: #eef4ff; color: var(--primary-blue); }
        
        .main-content { margin-left: 240px; padding: 0; }
        
        /* 🎨 Filter Section Styling (As per Screenshot) */
        .filter-bar {
            background: #fff;
            padding: 15px 30px;
            border-bottom: 1px solid var(--card-border);
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
        }
        .filter-bar .form-select, .filter-bar .form-control {
            max-width: 220px;
            border-radius: 6px;
            font-size: 14px;
            border: 1px solid #dee2e6;
            padding: 8px 12px;
        }
        .btn-apply {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 8px 25px;
            border-radius: 6px;
            font-weight: 500;
        }
        .btn-apply:hover { background-color: #5a6268; color: white; }

        .top-header { background: #fff; padding: 15px 30px; border-bottom: 1px solid var(--card-border); display: flex; justify-content: space-between; align-items: center; }

        .analytics-wrapper { padding: 25px; }

        .stat-card {
            background: #fff;
            border-radius: 12px;
            padding: 18px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: transform 0.2s;
        }
        .stat-card:hover { transform: translateY(-3px); }
        .stat-icon { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        
        .bg-soft-blue { background: #eef4ff; color: #007bff; }
        .bg-soft-green { background: #e8f5e9; color: #2e7d32; }
        .bg-soft-orange { background: #fff3e0; color: #ef6c00; }
        .bg-soft-red { background: #ffebee; color: #c62828; }

        .chart-card { background: #fff; border-radius: 12px; padding: 20px; border: 1px solid var(--card-border); margin-bottom: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.03); }
        .chart-container { position: relative; width: 100%; height: 300px; }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .chart-title { font-size: 15px; font-weight: 600; color: #444; margin: 0; }

        .performance-table thead th { background: #fcfcfd; border-bottom: 1px solid var(--card-border); font-size: 11px; letter-spacing: 0.5px; color: #888; padding: 12px; }
        .performance-table td { padding: 12px; font-size: 14px; border-bottom: 1px solid #f8f9fa; }

        @media (max-width: 992px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; }
            .filter-bar .form-select, .filter-bar .form-control { max-width: 100%; width: 100%; }
        }
    </style>
    <style>
        /* मोबाइल पर जब 'active' क्लास हो तो साइडबार दिखे */
@media (max-width: 992px) {
    .sidebar {
        display: block !important;
        left: -240px; /* डिफ़ॉल्ट रूप से छुपा हुआ */
        transition: left 0.3s ease;
        height: 100vh;
    }
    .sidebar.show {
        left: 0; /* दिखाने के लिए */
    }
    .main-content {
        transition: margin-left 0.3s ease;
    }
}
    </style>
</head>
<body>

    <div class="sidebar shadow-sm" id="sidebar">
        <div class="p-4 mb-2">
            <h4 class="text-primary fw-bold mb-0"><i class="bi bi-rocket-takeoff-fill me-2"></i>TMS Pro</h4>
        </div>
        <nav class="nav flex-column h-100">
            <a href="index.html" class="nav-link"><i class="bi bi-grid-1x2 me-3"></i>Dashboard</a>
            <a href="create-task.html" class="nav-link"><i class="bi bi-plus-square me-3"></i>Create Task</a>
            <a href="taskflow.html" class="nav-link"><i class="bi bi-kanban me-3"></i>Task Flow</a>
            <a href="#" class="nav-link active"><i class="bi bi-graph-up-arrow me-3"></i>Analytics</a>
            <a href="#" class="nav-link  text-danger"><i class="bi bi-box-arrow-left me-3"></i>Logout</a>
        </nav>
    </div>

    <main class="main-content">
        

        <!-- <header class="top-header">
            
            <h5 class="fw-bold mb-0">System Analytics</h5>
            <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-download me-1"></i> Report</button>
                <button class="btn btn-sm btn-primary">Refresh Data</button>
            </div>
        </header> -->
        <header class="top-header">
    <div class="d-flex align-items-center gap-3">
        <button class="btn d-lg-none border-0 p-0" id="menuToggle">
            <i class="bi bi-list fs-2"></i>
        </button>
        <h5 class="fw-bold mb-0">System Analytics</h5>
    </div>
    <div class="d-flex gap-2">
                <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-download me-1"></i> Report</button>
                <button class="btn btn-sm btn-primary">Refresh Data</button>
            </div>
    </header>
        <div class="filter-bar">
            <select class="form-select">
                <option selected disabled>Select Project</option>
                <option>TwoDots Films</option>
                <option>JNRS Group</option>
                <option>ERP System</option>
            </select>

            <select class="form-select">
                <option selected disabled>Select User</option>
                <option>Aashish</option>
                <option>Rahul</option>
                <option>Admin</option>
            </select>

            <input type="date" class="form-control" placeholder="mm/dd/yyyy">

            <button class="btn btn-apply">Apply Filter</button>
        </div>

        <div class="analytics-wrapper">
            <div class="row g-3 mb-4">
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <div class="stat-icon bg-soft-blue"><i class="bi bi-briefcase"></i></div>
                        <div><div class="text-muted small">Total Tasks</div><div class="fw-bold fs-5">120</div></div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <div class="stat-icon bg-soft-green"><i class="bi bi-check-circle"></i></div>
                        <div><div class="text-muted small">Completed</div><div class="fw-bold fs-5">85</div></div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <div class="stat-icon bg-soft-orange"><i class="bi bi-clock-history"></i></div>
                        <div><div class="text-muted small">In Progress</div><div class="fw-bold fs-5">20</div></div>
                    </div>
                </div>
                <div class="col-md-3 col-6">
                    <div class="stat-card">
                        <div class="stat-icon bg-soft-red"><i class="bi bi-exclamation-octagon"></i></div>
                        <div><div class="text-muted small">Overdue</div><div class="fw-bold fs-5">15</div></div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-lg-8">
                    <div class="chart-card">
                        <div class="chart-header">
                            <h6 class="chart-title">Monthly Task Completion</h6>
                        </div>
                        <div class="chart-container">
                            <canvas id="monthlyChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-lg-4">
                    <div class="chart-card">
                        <div class="chart-header">
                            <h6 class="chart-title">Priority Breakdown</h6>
                        </div>
                        <div class="chart-container">
                            <canvas id="priorityChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="chart-card">
                        <div class="chart-header">
                            <h6 class="chart-title">Top Performers</h6>
                        </div>
                        <div class="table-responsive">
                            <table class="table performance-table align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Team Member</th>
                                        <th>Task Status</th>
                                        <th>Efficiency</th>
                                        <th class="text-end">Completed</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center me-2" style="width: 28px; height: 28px; font-size: 11px;">A</div>
                                                <span>Aashish</span>
                                            </div>
                                        </td>
                                        <td><div class="progress" style="height: 6px; width: 100px;"><div class="progress-bar bg-success" style="width: 75%"></div></div></td>
                                        <td><span class="badge bg-light text-success">High</span></td>
                                        <td class="text-end fw-semibold">15</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Charts Initialization
        Chart.defaults.font.family = "'Inter', sans-serif";
        
        new Chart(document.getElementById('monthlyChart'), {
            type: 'line',
            data: {
                labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
                datasets: [{
                    label: 'Tasks',
                    data: [40, 55, 45, 70, 85, 60],
                    borderColor: '#007bff',
                    tension: 0.3,
                    fill: true,
                    backgroundColor: 'rgba(0, 123, 255, 0.05)'
                }]
            },
            options: { responsive: true, maintainAspectRatio: false }
        });

        new Chart(document.getElementById('priorityChart'), {
            type: 'doughnut',
            data: {
                labels: ['Low', 'Med', 'High', 'Urgent'],
                datasets: [{
                    data: [30, 45, 15, 10],
                    backgroundColor: ['#e9ecef', '#ffc107', '#17a2b8', '#dc3545']
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '70%' }
        });
    </script>
    <script>
        document.getElementById('menuToggle').addEventListener('click', function() {
    document.getElementById('sidebar').classList.toggle('show');
});

// स्क्रीन पर कहीं भी बाहर क्लिक करने पर साइडबार बंद हो जाए (Optional)
document.addEventListener('click', function(event) {
    const sidebar = document.getElementById('sidebar');
    const menuBtn = document.getElementById('menuToggle');
    if (!sidebar.contains(event.target) && !menuBtn.contains(event.target)) {
        sidebar.classList.remove('show');
    }
});
    </script>
</body>
</html>
