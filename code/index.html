<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMS | Modern Dashboard</title>
    <!-- Bootstrap 5 & Google Fonts -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
    --primary-color: #4e73df;
    --sidebar-width: 250px;
}

body {
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
}

.sidebar {
    width: var(--sidebar-width);
    height: 100vh;
    position: fixed;
    background: #ffffff;
    z-index: 1000;
    transition: all 0.3s;
}

.main-content {
    margin-left: var(--sidebar-width);
    transition: all 0.3s;
    min-height: 100vh;
}

.nav-link {
    color: #5a5c69;
    padding: 12px 15px;
    border-radius: 8px;
    margin-bottom: 5px;
    transition: 0.2s;
}

.nav-link:hover, .nav-link.active {
    background: #f8f9fc;
    color: var(--primary-color);
}

.stat-card {
    transition: transform 0.2s;
}

.stat-card:hover {
    transform: translateY(-5px);
}

/* Kanban Column Styling */
.kanban-column {
    background-color: #ebedf0;
    border-radius: 10px;
    min-height: 70vh;
    padding: 15px;
}

.kanban-card {
    background: white;
    padding: 15px;
    border-radius: 8px;
    margin-bottom: 15px;
    cursor: grab;
    border-left: 4px solid #4e73df;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}

/* Responsive adjustment */
@media (max-width: 768px) {
    .sidebar { margin-left: calc(-1 * var(--sidebar-width)); }
    .main-content { margin-left: 0; }
    .sidebar.active { margin-left: 0; }
}
    </style>
</head>
<body class="bg-light">

    <!-- Sidebar -->
    <div class="sidebar shadow" id="sidebar">
        <div class="p-4">
            <h4 class="text-primary fw-bold"><i class="bi bi-layers-half me-2"></i>TMS Pro</h4>
        </div>
        <nav class="nav flex-column px-3">
            <a href="index.html" class="nav-link active"><i class="bi bi-grid-1x2-fill me-3"></i>Dashboard</a>
            <a href="projects.html" class="nav-link"><i class="bi bi-briefcase me-3"></i>Projects</a>
            <a href="kanban.html" class="nav-link"><i class="bi bi-kanban me-3"></i>Kanban Board</a>
            <a href="#" class="nav-link"><i class="bi bi-calendar3 me-3"></i>Calendar</a>
            <a href="#" class="nav-link"><i class="bi bi-people me-3"></i>Team</a>
            <hr>
            <a href="#" class="nav-link"><i class="bi bi-graph-up me-3"></i>Reports</a>
            <a href="#" class="nav-link"><i class="bi bi-gear me-3"></i>Settings</a>
        </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="content">
        <!-- Top Navbar -->
        <nav class="navbar navbar-expand-lg navbar-white bg-white border-bottom sticky-top px-4">
            <button class="btn btn-light d-md-none" id="sidebarToggle"><i class="bi bi-list"></i></button>
            <div class="ms-auto d-flex align-items-center">
                <div class="search-box me-4 d-none d-md-block">
                    <input type="text" class="form-control form-control-sm" placeholder="Search tasks...">
                </div>
                <div class="position-relative me-3">
                    <i class="bi bi-bell fs-5 cursor-pointer"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.6rem;">3</span>
                </div>
                <img src="https://i.pravatar.cc/150?u=admin" class="rounded-circle border" width="35" alt="Profile">
            </div>
        </nav>

        <div class="container-fluid p-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold">System Overview</h3>
                <button class="btn btn-primary btn-sm rounded-pill px-3">+ New Project</button>
            </div>

            <!-- Stats Cards -->
            <div class="row g-4 mb-4">
                <div class="col-md-3">
                    <div class="card stat-card border-0 shadow-sm p-3 border-start border-primary border-5">
                        <small class="text-muted fw-semibold uppercase">Total Tasks</small>
                        <h2 class="fw-bold mt-2">124</h2>
                        <span class="text-success small"><i class="bi bi-arrow-up"></i> 12% increase</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card border-0 shadow-sm p-3 border-start border-success border-5">
                        <small class="text-muted fw-semibold uppercase">Completed</small>
                        <h2 class="fw-bold mt-2">84</h2>
                        <div class="progress mt-2" style="height: 6px;">
                            <div class="progress-bar bg-success" style="width: 67%"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card border-0 shadow-sm p-3 border-start border-warning border-5">
                        <small class="text-muted fw-semibold uppercase">In Progress</small>
                        <h2 class="fw-bold mt-2">30</h2>
                        <span class="text-warning small">Ongoing priority</span>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card stat-card border-0 shadow-sm p-3 border-start border-danger border-5">
                        <small class="text-muted fw-semibold uppercase">Overdue</small>
                        <h2 class="fw-bold mt-2">10</h2>
                        <span class="text-danger small">Requires attention</span>
                    </div>
                </div>
            </div>

            <!-- Charts Section -->
            <div class="row">
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm p-4 mb-4">
                        <h5 class="fw-bold mb-3">Project Progress</h5>
                        <canvas id="projectChart" height="250"></canvas>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm p-4 mb-4">
                        <h5 class="fw-bold mb-3">Task Distribution</h5>
                        <canvas id="taskPieChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/script.js">
        // Sidebar Toggle for Mobile
document.getElementById('sidebarToggle')?.addEventListener('click', function() {
    document.getElementById('sidebar').classList.toggle('active');
});

// Project Progress Chart (Bar Chart)
const ctx = document.getElementById('projectChart')?.getContext('2d');
if(ctx) {
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'],
            datasets: [{
                label: 'Completed Tasks',
                data: [45, 59, 80, 81, 56, 95],
                backgroundColor: '#4e73df',
                borderRadius: 5
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
}

// Task Distribution Chart (Pie Chart)
const ctx2 = document.getElementById('taskPieChart')?.getContext('2d');
if(ctx2) {
    new Chart(ctx2, {
        type: 'doughnut',
        data: {
            labels: ['To Do', 'In Progress', 'Done'],
            datasets: [{
                data: [30, 20, 50],
                backgroundColor: ['#f6c23e', '#4e73df', '#1cc88a']
            }]
        }
    });
}

// Basic Drag and Drop Logic (Conceptual)
const cards = document.querySelectorAll('.kanban-card');
const columns = document.querySelectorAll('.kanban-column');

cards.forEach(card => {
    card.addEventListener('dragstart', () => card.classList.add('dragging'));
    card.addEventListener('dragend', () => card.classList.remove('dragging'));
});

columns.forEach(column => {
    column.addEventListener('dragover', e => {
        e.preventDefault();
        const dragging = document.querySelector('.dragging');
        column.appendChild(dragging);
    });
});
    </script>
</body>
</html>
