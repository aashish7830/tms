 <div class="modal-overlay" id="taskModal">
    <div class="modal-box">
        
        <div class="modal-header">
            <h2 class="modal-title">
                <i class="fa-regular fa-square-plus text-primary"></i> Create New Task
            </h2>
            <button class="close-btn" id="closeModalX">&times;</button>
        </div>

        <form id="taskForm">
            
            <div class="form-row">
                <div class="form-group col">
                    <label for="taskName">Task Name</label>
                    <input type="text" id="taskName" placeholder="e.g., Fix Navigation Bug" required>
                </div>
                <div class="form-group col">
                    <label for="taskDetail">Detail of Task</label>
                    <input type="text" id="taskDetail" placeholder="Provide a short breakdown..." required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="selectBusiness">Select Business</label>
                    <select id="selectBusiness" required>
                        <option value="" disabled selected>Select Business Type...</option>
                        <option value="cold">Cold</option>
                        <option value="shop">Shop</option>
                        <option value="food">Food</option>
                        <option value="water">Water</option>
                    </select>
                </div>
                
                <div class="form-group col">
                    <label for="selectBranch">Select Branch</label>
                    <select id="selectBranch" required>
                        <option value="" disabled selected>Select Branch...</option>
                        <option value="it">IT</option>
                        <option value="none-it">Non-IT</option>
                    </select>
                </div>

                <div class="form-group col">
                    <label for="selectDepartment">Select Department</label>
                    <select id="selectDepartment" required>
                        <option value="" disabled selected>Select Department...</option>
                        <option value="hr">Human Resources (HR)</option>
                        <option value="it">IT Department</option>
                        <option value="sales">Sales</option>
                        <option value="marketing">Marketing</option>
                        <option value="finance">Finance</option>
                        <option value="operations">Operations</option>
                        <option value="support">Customer Support</option>
                        <option value="admin">Administration</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="dueTime">Due Time</label>
                    <input type="time" id="dueTime" required>
                </div>

                <div class="form-group col">
                    <label for="frequency">Frequency of Task</label>
                    <select id="frequency">
                        <option value="daily" selected>Daily</option>
                        <option value="weekly">Weekly</option>
                        <option value="monthly">Monthly</option>
                        <option value="yearly">Yearly</option>
                        <option value="custom">Custom</option>
                    </select>
                </div>

                <div class="form-group col">
                    <label for="reviewCycle">Review Cycle of Task</label>
                    <select id="reviewCycle">
                        <option value="weekly" selected>Weekly</option>
                        <option value="monthly">Monthly</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col">
                    <label for="approval">Approval Required</label>
                    <select id="approval">
                        <option value="yes">Yes</option>
                        <option value="no" selected>No</option>
                    </select>
                </div>

                <div class="form-group col">
                    <label for="businessUse">Useful for Other Business?</label>
                    <select id="businessUse">
                        <option value="yes">Yes</option>
                        <option value="no" selected>No</option>
                    </select>
                </div>

                <div class="form-group col">
                    <label for="verification">Verification Required</label>
                    <select id="verification">
                        <option value="yes">Yes</option>
                        <option value="no" selected>No</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="attachments">Attachments (Optional)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="attachments" multiple>
                </div>
                <small class="help-text">Aap multiple files select kar sakte hain.</small>
            </div>

            <div class="form-group">
                <label for="description">Description / Notes</label>
                <textarea id="description" rows="4" placeholder="Provide extra details about the task requirements..."></textarea>
            </div>

            <div class="modal-footer">
                <button type="button" class="btn-cancel" id="closeModalCancel">Cancel</button>
                <button type="submit" class="btn-save">Save Task</button>
            </div>

        </form>
    </div>
</div>
